<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Med Apps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10171f"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="#21262d" stroke-width="4"/>
  <!-- medical cross -->
  <g>
    <rect x="212" y="120" width="88" height="272" rx="22" fill="url(#cross)"/>
    <rect x="120" y="212" width="272" height="88" rx="22" fill="url(#cross)"/>
  </g>
  <!-- offline / on-device dot -->
  <circle cx="256" cy="256" r="30" fill="#0d1117"/>
  <circle cx="256" cy="256" r="14" fill="#58a6ff"/>
</svg>
